name: Fuzz tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-fuzz:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: energo
          POSTGRES_USER: energo
          POSTGRES_PASSWORD: energo
        options: >-
          --health-cmd "pg_isready -U energo -d energo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/pyproject.toml

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run Django migrations
        run: uv run python manage.py migrate
        env:
          DB_ENGINE: postgres
          POSTGRES_DB: energo
          POSTGRES_USER: energo
          POSTGRES_PASSWORD: energo
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

      - name: Run fuzz tests with coverage
        run: |
          uv run coverage run manage.py test core.fuzz_tests --verbosity=2 && \
          uv run coverage report && \
          uv run coverage xml -o ../coverage.xml
        env:
          DB_ENGINE: postgres
          POSTGRES_DB: energo
          POSTGRES_USER: energo
          POSTGRES_PASSWORD: energo
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

  frontend-fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run fuzz tests
        run: npx vitest run --reporter=verbose
